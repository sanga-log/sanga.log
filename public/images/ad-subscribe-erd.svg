<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0.5" y="0.5" width="759" height="539" rx="12" fill="#faf9f6" stroke="#ebe8e0"/>

  <!-- 구역 -->
  <rect x="16" y="16" width="424" height="456" rx="8" fill="#e7f5ec" opacity="0.75"/>
  <rect x="456" y="16" width="288" height="456" rx="8" fill="#f1efe9"/>
  <text x="32" y="44" font-size="14" font-weight="700" fill="#1f5a37">새로 만든 테이블</text>
  <text x="472" y="44" font-size="14" font-weight="700" fill="#555555">이미 있던 테이블</text>

  <!-- 카카오 광고 발송: 구독·회차와 묶이지 않고 매장만 참조 -->
  <line x1="220" y1="88" x2="468" y2="128" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
  <g font-size="14.5" font-weight="700" fill="#2f2f2f" text-anchor="middle">
    <rect x="50" y="66" width="170" height="44" rx="7" fill="#ffffff" stroke="#b9dcc6"/>
    <text x="135" y="93">카카오 광고 발송</text>
  </g>

  <g transform="translate(0,60)">
  <!-- 새 테이블끼리의 관계 -->
  <g stroke="#1f5a37" stroke-width="1.6" fill="none">
    <line x1="135" y1="114" x2="135" y2="160"/>
    <line x1="135" y1="204" x2="135" y2="260"/>
    <line x1="135" y1="304" x2="135" y2="350"/>
    <line x1="220" y1="182" x2="270" y2="182"/>
    <path d="M220,102 H345 V160"/>
  </g>

  <!-- 기존 테이블 참조 -->
  <g stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <line x1="220" y1="82" x2="468" y2="82"/>
    <line x1="420" y1="182" x2="468" y2="152"/>
    <line x1="420" y1="182" x2="468" y2="212"/>
    <line x1="220" y1="282" x2="468" y2="282"/>
    <line x1="220" y1="372" x2="468" y2="372"/>
  </g>

  <!-- 기존 테이블끼리의 관계 -->
  <g stroke="#555555" stroke-width="1.6" fill="none">
    <line x1="584" y1="282" x2="624" y2="282"/>
    <line x1="526" y1="304" x2="526" y2="350"/>
  </g>

  <!-- 관계 표기 -->
  <g font-size="12.5" fill="#1f5a37" font-weight="700">
    <text x="145" y="142">1:N</text>
    <text x="145" y="237">1:N</text>
    <text x="145" y="332">1:N</text>
    <text x="234" y="174">1:N</text>
    <text x="355" y="138">1:N</text>
  </g>
  <g font-size="12.5" fill="#555555" font-weight="700">
    <text x="536" y="332">1:N</text>
    <text x="330" y="364">1:1</text>
  </g>

  <!-- 새 테이블 -->
  <g font-size="14.5" font-weight="700" fill="#2f2f2f" text-anchor="middle">
    <rect x="50" y="70" width="170" height="44" rx="7" fill="#ffffff" stroke="#b9dcc6"/>
    <text x="135" y="97">구독</text>
    <rect x="50" y="160" width="170" height="44" rx="7" fill="#ffffff" stroke="#b9dcc6"/>
    <text x="135" y="187">회차</text>
    <rect x="270" y="160" width="150" height="44" rx="7" fill="#ffffff" stroke="#b9dcc6"/>
    <text x="345" y="187">이력</text>
    <rect x="50" y="260" width="170" height="44" rx="7" fill="#ffffff" stroke="#b9dcc6"/>
    <text x="135" y="287">회차별 쿠폰 설정</text>
    <rect x="50" y="350" width="170" height="44" rx="7" fill="#ffffff" stroke="#b9dcc6"/>
    <text x="135" y="377">회차별 발급 쿠폰</text>
  </g>

  <!-- 기존 테이블 -->
  <g font-size="14.5" font-weight="700" fill="#2f2f2f" text-anchor="middle">
    <rect x="468" y="60" width="116" height="44" rx="7" fill="#ffffff" stroke="#d6d2c8"/>
    <text x="526" y="87">매장</text>
    <rect x="468" y="130" width="116" height="44" rx="7" fill="#ffffff" stroke="#d6d2c8"/>
    <text x="526" y="157">주문</text>
    <rect x="468" y="190" width="116" height="44" rx="7" fill="#ffffff" stroke="#d6d2c8"/>
    <text x="526" y="217">카드</text>
    <rect x="468" y="260" width="116" height="44" rx="7" fill="#ffffff" stroke="#d6d2c8"/>
    <text x="526" y="287">쿠폰 기본 타입</text>
    <rect x="624" y="260" width="110" height="44" rx="7" fill="#ffffff" stroke="#d6d2c8"/>
    <text x="679" y="280" font-size="13.5">쿠폰 상세 설정</text>
    <text x="679" y="296" font-size="11.5" font-weight="400" fill="#666666">요일 등</text>
    <rect x="468" y="350" width="116" height="44" rx="7" fill="#ffffff" stroke="#d6d2c8"/>
    <text x="526" y="377">발급된 쿠폰</text>
  </g>

  <!-- 범례 -->
  <g font-size="13" fill="#666666">
    <line x1="150" y1="444" x2="186" y2="444" stroke="#1f5a37" stroke-width="1.6"/>
    <text x="194" y="449">테이블 사이의 관계</text>
    <line x1="350" y1="444" x2="386" y2="444" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="394" y="449">이미 있던 테이블을 참조</text>
  </g>
  </g>
</svg>
