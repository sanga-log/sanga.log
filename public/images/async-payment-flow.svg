<svg xmlns="http://www.w3.org/2000/svg" width="800" height="604" viewBox="0 0 800 604" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5a37"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="603" rx="12" fill="#faf9f6" stroke="#ebe8e0"/>

  <!-- "아직 모른다" 구간 -->
  <rect x="16" y="180" width="768" height="352" rx="8" fill="#e7f5ec" opacity="0.75"/>
  <text x="774" y="200" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f5a37">"아직 모른다" 구간</text>

  <!-- 참여자 -->
  <g font-size="15" font-weight="700" fill="#2f2f2f" text-anchor="middle">
    <rect x="20" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="85" y="48">화면 (프론트)</text>
    <rect x="175" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="240" y="48">구독 API</text>
    <rect x="330" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="395" y="48">워커</text>
    <rect x="485" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="550" y="48">주문 서버</text>
    <rect x="640" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="705" y="48">결제 서버 · PG</text>
  </g>

  <!-- 생명선 -->
  <g stroke="#d6d2c8" stroke-dasharray="4 4">
    <line x1="85" y1="64" x2="85" y2="548"/>
    <line x1="240" y1="64" x2="240" y2="548"/>
    <line x1="395" y1="64" x2="395" y2="548"/>
    <line x1="550" y1="64" x2="550" y2="548"/>
    <line x1="705" y1="64" x2="705" y2="548"/>
  </g>

  <!-- ① 신청 -->
  <line x1="85" y1="100" x2="236" y2="100" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="162" y="91" text-anchor="middle" font-size="13.5" fill="#2f2f2f">① 구독 신청</text>

  <rect x="182" y="112" width="116" height="26" rx="5" fill="#ffffff" stroke="#cfcac0"/>
  <text x="240" y="130" text-anchor="middle" font-size="12.5" fill="#2f2f2f">PENDING 저장</text>

  <line x1="240" y1="163" x2="89" y2="163" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="162" y="155" text-anchor="middle" font-size="13" fill="#555555">응답: PENDING (접수만)</text>

  <!-- ② 구독 API → 워커 -->
  <line x1="240" y1="222" x2="391" y2="222" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="317" y="213" text-anchor="middle" font-size="13.5" fill="#2f2f2f">② 결제 요청 (SQS)</text>
  <text x="317" y="241" text-anchor="middle" font-size="12" fill="#888888">DB 커밋 뒤에 보냄</text>

  <!-- ③ 워커 → 주문 서버 -->
  <line x1="395" y1="272" x2="546" y2="272" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="472" y="263" text-anchor="middle" font-size="13.5" fill="#2f2f2f">③ 넘김 (SQS)</text>

  <rect x="502" y="286" width="96" height="26" rx="5" fill="#ffffff" stroke="#cfcac0"/>
  <text x="550" y="304" text-anchor="middle" font-size="12.5" fill="#2f2f2f">주문 생성</text>

  <!-- ④ 주문 서버 → 결제 서버 -->
  <line x1="550" y1="336" x2="701" y2="336" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="627" y="327" text-anchor="middle" font-size="13.5" fill="#2f2f2f">④ 결제 요청 (SNS)</text>

  <rect x="650" y="350" width="110" height="26" rx="5" fill="#ffffff" stroke="#cfcac0"/>
  <text x="705" y="368" text-anchor="middle" font-size="12.5" fill="#2f2f2f">PG 승인 요청</text>

  <!-- ⑤ 결제 서버 → 주문 서버 -->
  <line x1="705" y1="400" x2="554" y2="400" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="627" y="391" text-anchor="middle" font-size="13.5" fill="#2f2f2f">⑤ 결제 결과</text>

  <!-- ⑥ 주문 서버 → 워커 -->
  <line x1="550" y1="438" x2="399" y2="438" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="472" y="429" text-anchor="middle" font-size="13.5" fill="#2f2f2f">⑥ 완료·실패 (SNS)</text>
  <text x="472" y="457" text-anchor="middle" font-size="12" fill="#888888">다른 서비스 큐로도 같이 퍼짐</text>

  <rect x="318" y="468" width="154" height="26" rx="5" fill="#ffffff" stroke="#cfcac0"/>
  <text x="395" y="486" text-anchor="middle" font-size="12.5" fill="#2f2f2f">ACTIVE / FAILED로 변경</text>

  <!-- 폴링 -->
  <g font-size="12.5" fill="#1f5a37" text-anchor="middle">
    <line x1="85" y1="214" x2="236" y2="214" stroke="#1f5a37" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowGreen)"/>
    <text x="162" y="207">상태 조회 → PENDING</text>
    <line x1="85" y1="280" x2="236" y2="280" stroke="#1f5a37" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowGreen)"/>
    <text x="162" y="273">상태 조회 → PENDING</text>
    <text x="162" y="352">⋯ 1초마다 반복 ⋯</text>
    <line x1="85" y1="430" x2="236" y2="430" stroke="#1f5a37" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowGreen)"/>
    <text x="162" y="423">상태 조회 → PENDING</text>
    <line x1="85" y1="516" x2="236" y2="516" stroke="#1f5a37" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <text x="162" y="508" font-weight="700">상태 조회 → ACTIVE</text>
  </g>

  <text x="400" y="578" text-anchor="middle" font-size="13" fill="#666666">화면은 1초마다 최대 10번 묻고, 10초가 지나도 PENDING이면 "결제 확인 중"으로 바꿉니다.</text>
</svg>
