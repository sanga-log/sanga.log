<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5a37"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="409" rx="12" fill="#faf9f6" stroke="#ebe8e0"/>

  <!-- "아직 모른다" 구간 -->
  <rect x="16" y="180" width="728" height="126" rx="8" fill="#e7f5ec" opacity="0.75"/>
  <text x="734" y="200" text-anchor="end" font-size="13.5" font-weight="700" fill="#1f5a37">"아직 모른다" 구간</text>

  <!-- 참여자 -->
  <g font-size="15" font-weight="700" fill="#2f2f2f" text-anchor="middle">
    <rect x="35" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="100" y="48">화면 (프론트)</text>
    <rect x="225" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="290" y="48">구독 API</text>
    <rect x="415" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="480" y="48">결제 서버 · PG</text>
    <rect x="605" y="22" width="130" height="42" rx="8" fill="#ffffff" stroke="#e2e2e2"/>
    <text x="670" y="48">결제 결과 워커</text>
  </g>

  <!-- 생명선 -->
  <g stroke="#d6d2c8" stroke-dasharray="4 4">
    <line x1="100" y1="64" x2="100" y2="352"/>
    <line x1="290" y1="64" x2="290" y2="352"/>
    <line x1="480" y1="64" x2="480" y2="352"/>
    <line x1="670" y1="64" x2="670" y2="352"/>
  </g>

  <!-- ① 신청 -->
  <line x1="100" y1="100" x2="286" y2="100" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="195" y="91" text-anchor="middle" font-size="13.5" fill="#2f2f2f">① 구독 신청</text>

  <rect x="232" y="112" width="116" height="26" rx="5" fill="#ffffff" stroke="#cfcac0"/>
  <text x="290" y="130" text-anchor="middle" font-size="12.5" fill="#2f2f2f">PENDING 저장</text>

  <line x1="290" y1="163" x2="104" y2="163" stroke="#555555" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="195" y="155" text-anchor="middle" font-size="13" fill="#555555">응답: PENDING (접수만)</text>

  <!-- ② 결제 요청 -->
  <line x1="290" y1="212" x2="476" y2="212" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="385" y="203" text-anchor="middle" font-size="13.5" fill="#2f2f2f">② 결제 요청 (SQS)</text>
  <text x="385" y="231" text-anchor="middle" font-size="12" fill="#888888">DB 커밋 뒤에 보냄</text>

  <!-- ③ 결제 결과 -->
  <line x1="480" y1="260" x2="666" y2="260" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="575" y="251" text-anchor="middle" font-size="13.5" fill="#2f2f2f">③ 결제 결과 (SQS)</text>

  <rect x="593" y="274" width="154" height="26" rx="5" fill="#ffffff" stroke="#cfcac0"/>
  <text x="670" y="292" text-anchor="middle" font-size="12.5" fill="#2f2f2f">ACTIVE / FAILED로 변경</text>

  <!-- 폴링 -->
  <g font-size="12.5" fill="#1f5a37" text-anchor="middle">
    <line x1="100" y1="202" x2="286" y2="202" stroke="#1f5a37" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowGreen)"/>
    <text x="195" y="195">상태 조회 → PENDING</text>
    <line x1="100" y1="240" x2="286" y2="240" stroke="#1f5a37" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrowGreen)"/>
    <text x="195" y="233">상태 조회 → PENDING</text>
    <text x="195" y="274">⋯ 1초마다 반복 ⋯</text>
    <line x1="100" y1="326" x2="286" y2="326" stroke="#1f5a37" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <text x="195" y="318" font-weight="700">상태 조회 → ACTIVE</text>
  </g>

  <text x="380" y="386" text-anchor="middle" font-size="13" fill="#666666">화면은 1초마다 최대 10번 묻고, 10초가 지나도 PENDING이면 "결제 확인 중"으로 바꿉니다.</text>
</svg>
